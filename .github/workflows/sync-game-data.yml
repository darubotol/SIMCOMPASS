name: Sync SIMCOMPASS game database
on:
  workflow_dispatch:
    inputs:
      realm:
        description: "Sim Companies realm number (0 = default realm)"
        required: true
        default: "0"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: simcompass-game-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SIMCOMPASS
        uses: actions/checkout@v4
      - name: Fetch public resource catalogue once
        env:
          REALM: ${{ inputs.realm || '0' }}
        run: |
          mkdir -p data
          curl --fail --silent --show-error --location --retry 2 \
            -H "accept: application/json" \
            "https://api.simcotools.com/v1/realms/${REALM}/resources?disable_pagination=True" \
            -o "$RUNNER_TEMP/raw-resources.json"
      - name: Normalize game database
        env:
          REALM: ${{ inputs.realm || '0' }}
        run: |
          cp "$RUNNER_TEMP/raw-resources.json" data/raw-resources.json
          python scripts/build_database.py
          cp data/raw-resources.json "$RUNNER_TEMP/raw-resources.json"
          cp data/game-database.json "$RUNNER_TEMP/game-database.json"
      - name: Commit refreshed data on top of latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/raw-resources.json" data/raw-resources.json
          cp "$RUNNER_TEMP/game-database.json" data/game-database.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw-resources.json data/game-database.json
          git diff --cached --quiet || git commit -m "Sync Sim Companies game database"
          git push
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest database
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy SIMCOMPASS
        id: deployment
        uses: actions/deploy-pages@v4
